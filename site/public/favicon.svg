<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="КП УЗН Деснянського району">
  <!--
    Значок вкладки. Временный знак «Вариант А», упрощённый до двух фигур:
    тонкие линии знака из шапки на 16 px сливаются в серое пятно.
    Цвета написаны числами намеренно: файл значка — отдельный документ,
    tokens.css на него не действует. Значения — --c-deep и --c-mint
    дизайн-системы, раздел 3. Заменяется вместе с логотипом (заглушка 29 ТЗ).
  -->
  <circle cx="16" cy="16" r="16" fill="#2F583F"/>
  <path
    fill="#A8D89D"
    fill-rule="evenodd"
    transform="rotate(-20 16 16)"
    d="M16 3C24 10 24 22 16 29 8 22 8 10 16 3Z M16 8.5C18.6 13 18.6 19 16 23.5 13.4 19 13.4 13 16 8.5Z"
  />
</svg>
