<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="КП УЗН Деснянського району">
  <!--
    Значок вкладки. Знак предприятия «дерево в колі», форма Д2: тот же
    рисунок, что в шапке (SiteHeader.astro), увеличенный в 16/15 — круг
    здесь занимает весь квадрат (r 16), в шапке r 15.
    Цвета написаны числами намеренно: файл значка — отдельный документ,
    tokens.css на него не действует. Значения — токены c-deep и c-mint
    дизайн-системы, раздел 3. Имена токенов записаны без ведущих дефисов:
    два дефиса подряд внутри комментария XML запрещены, и файл с ними
    перестаёт быть XML (решение 015, урок в docs/lessons-learned.md).
  -->
  <circle cx="16" cy="16" r="16" fill="#2F583F"/>
  <circle cx="16" cy="12.16" r="7.89" fill="#A8D89D"/>
  <rect x="14.5" y="18.67" width="2.99" height="7.36" fill="#A8D89D"/>
  <rect x="15.04" y="12.16" width="1.92" height="8" fill="#2F583F"/>
  <rect x="9.82" y="26.99" width="12.37" height="2.13" rx="1.07" fill="#A8D89D"/>
</svg>
