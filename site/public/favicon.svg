<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="КП УЗН Деснянського району">
  <!--
    Значок вкладки. Знак предприятия «дерево в колі», форма Д2: тот же
    рисунок, что в шапке (SiteHeader.astro), увеличенный в 16/15 — круг
    здесь занимает весь квадрат (r 16), в шапке r 15. Крона — три доли
    плюс прямоугольник между ними; полоска земли идёт от края до края
    круга и обрезается по нему (решения 015 и 016).
    Цвета написаны числами намеренно: файл значка — отдельный документ,
    tokens.css на него не действует. Значения — токены c-deep и c-mint
    дизайн-системы, раздел 3. Имена токенов записаны без ведущих дефисов:
    два дефиса подряд внутри комментария XML запрещены, и файл с ними
    перестаёт быть XML (урок в docs/lessons-learned.md).
  -->
  <defs>
    <clipPath id="favicon-disc">
      <circle cx="16" cy="16" r="16"/>
    </clipPath>
  </defs>
  <circle cx="16" cy="16" r="16" fill="#2F583F"/>
  <circle cx="10.24" cy="16.21" r="6.29" fill="#A8D89D"/>
  <circle cx="21.76" cy="16.21" r="6.29" fill="#A8D89D"/>
  <circle cx="16" cy="11.84" r="7.36" fill="#A8D89D"/>
  <rect x="10.24" y="13.87" width="11.52" height="8.64" fill="#A8D89D"/>
  <rect x="14.51" y="21.87" width="2.99" height="3.63" fill="#A8D89D"/>
  <rect x="15.04" y="13.49" width="1.92" height="9.17" fill="#2F583F"/>
  <rect x="0" y="25.92" width="32" height="1.28" fill="#A8D89D" clip-path="url(#favicon-disc)"/>
</svg>
