name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all checks
        run: npm run ci

      # Временно не блокирует задачу: исправленной версии picomatch в npm
      # пока нет (последняя 4.0.7 сама попадает в совет GHSA-fc5q-39xc-vjpf),
      # поэтому шаг падал бы на каждом PR, ничего не позволяя исправить.
      # Отчёт остаётся в логах. Вернуть блокировку по решению 013.
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high
