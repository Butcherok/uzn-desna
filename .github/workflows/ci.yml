name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Настоящая MongoDB для набора `server/src/gateway/mongo-store.test.ts`.
    # Версия — та же, что у кластера Atlas; сверяется в задаче 5б.
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
      # Без БД набор не пропускается молча, а падает.
      REQUIRE_MONGO_TESTS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all checks
        run: npm run ci

      # Временно не блокирует задачу: исправленной версии picomatch в npm
      # пока нет (последняя 4.0.7 сама попадает в совет GHSA-fc5q-39xc-vjpf),
      # поэтому шаг падал бы на каждом PR, ничего не позволяя исправить.
      # Отчёт остаётся в логе, а на странице прогона висит предупреждение:
      # `continue-on-error` для этого не годится — с ним шаг показывается
      # зелёным и сигнал пропадает. Вернуть блокировку по решению 013:
      # убрать `|| echo` и оставить голую команду.
      - name: Audit dependencies
        run: npm audit --audit-level=high || echo "::warning title=npm audit::Есть советы безопасности уровня high. Отчёт — в логе этого шага. Возврат блокировки — решение 013."
