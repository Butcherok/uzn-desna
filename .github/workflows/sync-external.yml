# Синхронизация внешних источников (ТЗ 7.1, 7.6; решение 023).
#
# Пишет не в `main`, а в ветку `sync-data`: прямой push в `main` запрещён
# правилом защиты (решение 006), а коммит от GITHUB_TOKEN не запускает
# рабочие процессы по `push`. Поэтому после изменения данных сайта этот
# процесс сам запускает `deploy` вручную (`workflow_dispatch` — исключение
# из этого правила), а `deploy` при сборке берёт `data/sync/` из `sync-data`.
name: Sync external

on:
  schedule:
    # Время в UTC. По Киеву зимой 06:43, 12:43, 18:43; летом на час позже.
    # Prozorro — только в утреннем прогоне (ТЗ 7.3, п. 3), лента — во всех
    # трёх (ТЗ 7.4, п. 4; решение 027). Минута 43, а не начало часа: с
    # 19.11.2026 по 20.11.2026 ни один запуск на :10 не состоялся (решение 033).
    # Если расписание снова молчит, раз в сутки прогон запускает `Deploy`
    # по своему расписанию (шаг `kick-sync`, решение 033).
    - cron: '43 4 * * *'
    - cron: '43 10 * * *'
    - cron: '43 16 * * *'
  workflow_dispatch:
    inputs:
      steps:
        description: 'Шаги через пробел: prozorro, feed'
        required: true
        default: 'prozorro feed'
      prozorro_url:
        description: 'Только для проверки 12.3: другой адрес поиска Prozorro (пусто — рабочий)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-external
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Choose steps
        id: steps
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_STEPS: ${{ inputs.steps }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            steps="$INPUT_STEPS"
          elif [ "$SCHEDULE" = "43 4 * * *" ]; then
            steps="prozorro feed"
          else
            steps="feed"
          fi
          echo "list=$steps" >> "$GITHUB_OUTPUT"
          echo "Шаги прогона: ${steps:-нет}"

      - name: Restore previous sync data
        if: steps.steps.outputs.list != ''
        run: |
          if git ls-remote --exit-code --heads origin sync-data > /dev/null; then
            git fetch --depth=1 origin sync-data
            git worktree add ../sync-data FETCH_HEAD
            git -C ../sync-data switch -c sync-data
            mkdir -p data/sync
            cp ../sync-data/data/sync/*.json data/sync/ 2> /dev/null || true
          else
            git worktree add --orphan -b sync-data ../sync-data
          fi

      - name: Run sync
        id: sync
        if: steps.steps.outputs.list != ''
        env:
          STEPS: ${{ steps.steps.outputs.list }}
          # Пусто — рабочий адрес. Для строки чек-листа 12.3 «испорченный адрес»
          # владелец задаёт адрес того же портала при ручном запуске.
          PROZORRO_SEARCH_URL: ${{ inputs.prozorro_url }}
        run: |
          set +e
          npm run sync -- $STEPS
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Commit to sync-data
        if: steps.sync.outputs.any_changed == 'true'
        run: |
          mkdir -p ../sync-data/data/sync
          cp data/sync/*.json ../sync-data/data/sync/
          cd ../sync-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sync
          git commit -m "chore(sync): update external data"
          git push origin sync-data

      - name: Start deploy
        if: steps.sync.outputs.site_changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      # Падение — после записи: счётчик сбоев уже в `sync-data`, а владелец
      # получает письмо GitHub о неудачном прогоне (ТЗ 7.5, п. 3).
      - name: Fail on third failure in a row
        if: steps.sync.outputs.exit != '' && steps.sync.outputs.exit != '0'
        run: exit 1
