name: Publish content

# Публикация правок из админки (ТЗ 8.5, 7.1; решение 041). Запускается
# кнопкой «Опублікувати зміни» (бэкенд вызывает `workflow_dispatch`) и
# первого числа месяца по расписанию. Забирает `GET /export`, пишет
# редактируемые файлы `data/` и загруженные файлы `media/` (решение 042) в
# незащищённую ветку `content-data` и запускает
# `Deploy`, дожидаясь его итога: итог этого прогона — итог публикации,
# его читает `/publish/status`.
on:
  workflow_dispatch:
  # 1-е число, 06:37 UTC — не на круглую минуту; запуски по расписанию
  # GitHub может задерживать.
  schedule:
    - cron: '37 6 1 * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Адрес сервиса не секрет; переменная репозитория `API_BASE` его заменяет.
      API_BASE: ${{ vars.API_BASE || 'https://uzn-desna-api.onrender.com' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Прежние опубликованные файлы — из `content-data`; ветки ещё нет —
      # сравнение с `data/` в `main`, ветка создаётся первым коммитом.
      - name: Prepare content-data
        run: |
          if git ls-remote --exit-code --heads origin content-data > /dev/null; then
            git fetch --depth=1 origin content-data
            git worktree add ../content-data FETCH_HEAD
            git -C ../content-data switch -c content-data
            echo "PREV_DIR=../content-data/data" >> "$GITHUB_ENV"
          else
            git worktree add --orphan -b content-data ../content-data
            echo "PREV_DIR=data" >> "$GITHUB_ENV"
          fi

      - name: Export from backend
        id: export
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          # Загруженные файлы приводятся к перечню прямо в ветке (решение 042).
          MEDIA_DIR: ../content-data
        run: npm run publish:export

      # Та же проверка, что у сборки: неверные данные не доходят до `Deploy`.
      - name: Check data files
        run: npm run data:check

      - name: Commit to content-data
        id: commit
        if: steps.export.outputs.changed == 'true'
        run: |
          mkdir -p ../content-data/data
          for name in contacts enterprise feed-rules leaders moderation public-docs scenarios services static-blocks vacancies; do
            cp "data/$name.json" ../content-data/data/
          done
          cd ../content-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # В ветке только `data/` и `media/`: добавляется всё, удалённые файлы тоже.
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений для content-data нет"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(content): publish admin changes (run ${{ github.run_id }})"
            git push origin content-data
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Коммит от `GITHUB_TOKEN` сам `Deploy` не запускает (решение 023),
      # поэтому запуск — явный, и прогон ждёт его итога.
      - name: Deploy and wait
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(date -u -d '-5 seconds' +%Y-%m-%dT%H:%M:%SZ)
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -f ref=main -F return_run_details=true --jq '.workflow_run_id // empty' || true)
          for i in 1 2 3 4 5; do
            [ -n "$id" ] && break
            sleep 5
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --event workflow_dispatch \
              --created ">=$started" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          done
          if [ -z "$id" ]; then
            echo "::error title=DEPLOY::прогон Deploy не найден"
            exit 1
          fi
          echo "Deploy: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
          # Свой опрос вместо `gh run watch`: тот падал от любого сбоя API —
          # 404, пока прогон ещё не виден (21.11.2026), и 500 посреди
          # слежения (22.11.2026), хотя `Deploy` проходил. Сбой API — повтор;
          # подряд 12 сбоев (3 мин) или 25 мин без итога — неудача.
          fails=0
          for i in $(seq 1 100); do
            if out=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json status,conclusion \
                --jq '.status + " " + (.conclusion // "")' 2> /dev/null); then
              fails=0
              case "$out" in
                "completed success") echo "Deploy: успех"; exit 0 ;;
                completed*) echo "::error title=DEPLOY::Deploy завершился: ${out#completed }"; exit 1 ;;
              esac
            else
              fails=$((fails + 1))
              echo "Deploy: GitHub не ответил (${fails} подряд)"
              if [ "$fails" -ge 12 ]; then
                echo "::error title=DEPLOY::GitHub не отвечает о прогоне $id"
                exit 1
              fi
            fi
            sleep 15
          done
          echo "::error title=DEPLOY::Deploy $id без итога за 25 минут"
          exit 1
