# Temporary probe for the news feed sources (ТЗ 7.4). Removed before the PR.
# Runs the real feed step on a runner without committing anything.
name: Probe feed

on:
  push:
    branches: [feat/news-feed]
    paths: [.github/workflows/probe-feed.yml, scripts/src/sync/feed/**]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Feed step, first run
        run: npm run sync -- feed
      - name: Feed step, second run (expect no change)
        run: npm run sync -- feed
      - name: Summary
        run: |
          jq -r '.state, (.items|length), (.items[] | "\(.publishedAt[0:10]) \(.sourceId) \(.via) excerpt=\(.excerpt != null) \(.title[0:60])")' data/sync/feed.json | head -50
          jq -c '.items[]' data/sync/sync-state.json
