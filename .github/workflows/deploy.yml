name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Ежедневная пересборка (решение 026): «Актуально до» у вакансий
  # срабатывает при сборке, поэтому сайт пересобирается хотя бы раз в сутки.
  # 22:20 UTC — после полуночи по Киеву и зимой, и летом. Запуски по
  # расписанию GitHub может задерживать.
  schedule:
    - cron: '20 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_PATH: /uzn-desna
      PUBLIC_SITE_ORIGIN: https://butcherok.github.io
    steps:
      - uses: actions/checkout@v7

      # Данные синхронизации живут в ветке `sync-data` (решение 023). Нет
      # ветки — сборка идёт на заготовке из `main` (`state: unknown`).
      - name: Overlay synced data
        run: |
          if git ls-remote --exit-code --heads origin sync-data > /dev/null; then
            git fetch --depth=1 origin sync-data
            git checkout FETCH_HEAD -- data/sync
            echo "data/sync взят из sync-data $(git rev-parse --short FETCH_HEAD)"
          else
            echo "Ветки sync-data нет — сборка на заготовке"
          fi

      # Опубликованные из админки файлы живут в ветке `content-data`
      # (решение 041). Нет ветки — сборка на файлах `data/` из `main`.
      - name: Overlay published content
        run: |
          if git ls-remote --exit-code --heads origin content-data > /dev/null; then
            git fetch --depth=1 origin content-data
            git checkout FETCH_HEAD -- data
            echo "data/*.json взяты из content-data $(git rev-parse --short FETCH_HEAD)"
          else
            echo "Ветки content-data нет — сборка на data/ из main"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check data files
        run: npm run data:check

      - name: Build site
        run: npm run build

      - name: Check first-screen budget
        run: npm run budget:check

      - name: Check build for secrets
        run: npm run secrets:check

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  # Запасной путь синхронизации (решение 033): расписание `Sync external`
  # с 19.11.2026 не срабатывало ни разу, а расписание `Deploy` срабатывает
  # (с опозданием). Ежедневный прогон `Deploy` по расписанию сам запускает
  # полную синхронизацию; она, если данные изменились, запустит `Deploy` ещё раз.
  kick-sync:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start Sync external
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-external.yml --repo "$GITHUB_REPOSITORY" --ref main -f steps="prozorro feed"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
